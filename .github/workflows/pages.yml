name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

# D-013: production should be a domain root. Set the SITE_URL and SITE_BASE repository variables
# (for example https://kernl.example/ and /) once a domain is chosen; the fallbacks serve the project subpath.
env:
  SITE_URL: ${{ vars.SITE_URL || 'https://kernlize.github.io/web/' }}
  SITE_BASE: ${{ vars.SITE_BASE || '/web/' }}
  VITEPRESS_BASE: ${{ vars.SITE_BASE || '/web/' }}docs/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:build
      - run: pnpm check:vocabulary
      - run: pnpm check:agent-ready
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
