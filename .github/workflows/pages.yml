name: Publish site

# D-013: the site is served at the root of https://kernlize.github.io/ from the public
# kernlize/kernlize.github.io repository, which holds only the built artifact. This
# repository stays private. Publishing needs SITE_PUBLISH_TOKEN: a fine-grained token
# with Contents read/write on kernlize/kernlize.github.io. Without it the job builds,
# audits and stops.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://kernlize.github.io/' }}
  SITE_BASE: ${{ vars.SITE_BASE || '/' }}
  VITEPRESS_BASE: ${{ vars.SITE_BASE || '/' }}docs/

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:build
      - run: pnpm check:vocabulary
      - run: pnpm check:agent-ready
      - name: Publish to kernlize/kernlize.github.io
        if: ${{ env.SITE_PUBLISH_TOKEN != '' }}
        env:
          SITE_PUBLISH_TOKEN: ${{ secrets.SITE_PUBLISH_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${SITE_PUBLISH_TOKEN}@github.com/kernlize/kernlize.github.io.git" site
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R .pages/. site/
          cd site
          git config user.name "kernl publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Publish kernl site from ${GITHUB_SHA::7}"
          git push origin HEAD:main
