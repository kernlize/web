name: Publish site

# D-019: the site is served at the root of https://kernl.run/ by a bunny.net static
# site. Every push to main builds, audits and deploys .pages/ as an immutable deploy;
# roll back with `bunny sites deployments publish --previous --force`.
# scripts/setup-bunny-secrets.sh sets the BUNNYNET_API_KEY secret and the BUNNY_SITE,
# SITE_URL and SITE_BASE variables. Without the secret the job builds, audits and stops.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy in flight: that leaves a half-written deploy directory.
concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://kernl.run/' }}
  SITE_BASE: ${{ vars.SITE_BASE || '/' }}
  VITEPRESS_BASE: ${{ vars.SITE_BASE || '/' }}docs/

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:build
      - run: pnpm check:vocabulary
      - run: pnpm check:agent-ready
      - name: Check deploy credentials
        id: bunny
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
        run: |
          if [ -n "$BUNNYNET_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::BUNNYNET_API_KEY is not set; built and audited without deploying. Run scripts/setup-bunny-secrets.sh."
          fi
      - name: Deploy to bunny.net
        id: deploy
        if: steps.bunny.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
        uses: BunnyWay/actions/deploy-site@931a74b9c45ea9f9f01435fbbf1649830e67d3b3 # deploy-site@0.1.2
        with:
          site: ${{ vars.BUNNY_SITE || 'kernl' }}
          directory: .pages
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
      - name: Report the live URL
        if: steps.deploy.outcome == 'success'
        run: echo "::notice::Deployed ${{ steps.deploy.outputs.deploy-id }} to ${{ steps.deploy.outputs.url }} (unchanged=${{ steps.deploy.outputs.unchanged }})"
