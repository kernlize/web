name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, test, docs, gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm test:applets
      - run: pnpm check:deps
      - run: pnpm check:packages
      - run: pnpm docs:check
      - run: pnpm --filter @kernlize/web build
      - run: node scripts/build-pages.mjs
      - run: pnpm check:vocabulary
      - run: pnpm check:agent-ready
      # D-032: every internal link must resolve under the production host's rules; an outbound link fails only when its target is gone.
      - name: Link gate
        run: pnpm check:links --external
      - run: pnpm slop

  jsr:
    name: JSR publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:jsr

  e2e:
    name: Browser
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm test:e2e
