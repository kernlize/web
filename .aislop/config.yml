version: 1
engines:
  format: true
  lint: true
  code-quality: true
  ai-slop: true
  # Architecture rules need a layer map this four-package repo does not have;
  # package boundaries are enforced by scripts/check-dependency-rules.mjs.
  architecture: false
  security: true
quality:
  maxFunctionLoc: 120
  maxFileLoc: 600
  maxNesting: 4
  maxParams: 5
lint:
  # Type checking runs separately and strictly in `pnpm type-check` and
  # `astro check`; running it again here would only duplicate that gate.
  typecheck: false
security:
  # Dependency advisories are tracked by a separate, non-blocking CI job.
  # The quality score measures code we wrote, not transitive devDependencies.
  audit: false
  auditTimeout: 25000
scoring:
  thresholds:
    good: 90
    ok: 75
  smoothing: 20
ci:
  failBelow: 100
  format: json
telemetry:
  enabled: false
